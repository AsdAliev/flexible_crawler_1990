<!DOCTYPE html>
<html>

<head>
    <title>CSS Selector & XPath</title>
    <link href="panel-styles.css" rel="stylesheet" />
</head>

<body>
    <h1>Form creation</h1>
    <div id="parse-settings">
        <div>
            <input type="checkbox" id="enable-pagination">
            <span>Pagination</span>
        </div>
        <div id="pagination-settings" style="display: none;">
            <div>
                <span>Pagination type:</span>
                <select id="pagination-type">
                    <option selected>Next element</option>
                    <option>URL param</option>
                </select>
            </div>

            <div id="next-pagination-elem">
                <div>
                    <span>Path type:</span>
                    <select>
                        <option selected>xpath</option>
                        <option>css</option>
                    </select>
                </div>
                <div>
                    <span>Path:</span>
                    <input type="text">
                </div>
            </div>
            <div id="pagination-query-param" style="display: none;">
                <span>Query param:</span>
                <input type="text">
            </div>
        </div>
    </div>

    <form action="" id="parse-form">
        <button id="form-submit" type="submit" for="parse-form">Submit</button>
    </form>
    <script src="panel.js" type="module"></script>
</body>

</html>
